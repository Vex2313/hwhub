<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disgaea DS — Nintendo DS — HW Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a0f;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top bar */
    .topbar {
      height: 44px;
      background: #11141e;
      border-bottom: 1px solid #1f2536;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 50;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: #1b202e;
      color: #cbd5e1;
      border: 1px solid #2d374d;
      padding: 4px 10px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .back-btn:hover { background: #262e45; color: #fff; }

    .game-title {
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-nds {
      background: #e11d48;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }

    .controls-hint {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .key {
      background: #1e2433;
      border: 1px solid #333f59;
      padding: 1px 5px;
      border-radius: 3px;
      color: #e2e8f0;
      font-family: monospace;
      font-size: 11px;
    }

    /* Game Container */
    #game-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 44px);
      position: relative;
      background: #000;
    }

    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <a href="../../index.html" class="back-btn">← Назад в хаб</a>
      <span class="badge-nds">NDS</span>
      <span class="game-title">Disgaea DS</span>
    </div>
    <div class="controls-hint">
      <span>Управление: <span class="key">Стрелки</span> / <span class="key">WASD</span> • A: <span class="key">X</span> • B: <span class="key">Z</span> • X: <span class="key">S</span> • Y: <span class="key">A</span> • Нижний экран: <span class="key">Мышь / Тач</span></span>
    </div>
  </header>

  <!-- NDS Emulator Screen -->
  <main id="game-container">
    <div id="game"></div>
  </main>

  <script>
    // Panic key handler from parent localStorage configuration
    window.addEventListener('keydown', (e) => {
      const panicKey = localStorage.getItem('hwhub_panic_key') || '\\';
      const panicAction = localStorage.getItem('hwhub_panic_action') || 'decoy';

      if (e.key === panicKey) {
        e.preventDefault();
        if (panicAction === 'dnevnik') {
          window.location.replace('https://dnevnik.ru');
        } else if (panicAction === 'wiki') {
          window.location.replace('https://ru.wikipedia.org/wiki/Информатика');
        } else if (panicAction === 'ege') {
          window.location.replace('https://inf-ege.sdamgia.ru/');
        } else {
          // Decoy screen: go back to hub which has decoy ready
          window.location.href = '../../index.html';
        }
      }
    });

    // EmulatorJS Setup for Nintendo DS
    window.EJS_player = '#game';
    window.EJS_core = 'desmume2015';
    window.EJS_gameName = 'Disgaea DS';
    window.EJS_gameUrl = 'game.zip';
    window.EJS_pathtodata = 'data/';
    window.EJS_startOnLoaded = true;
    window.EJS_language = 'en-US';
    window.EJS_disableAutoLang = false;
    window.EJS_color = '#e11d48';
  </script>
  <script src="data/loader.js"></script>
</body>
</html>
