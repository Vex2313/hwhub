<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Doodle Jump</title>
	<script type="text/javascript" src="js/jquery-2.1.1.min.js"></script>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			background: #11141e;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			overflow: hidden;
		}
		canvas {
			box-shadow: 0 10px 30px rgba(0,0,0,0.7);
			border-radius: 6px;
		}
		canvas:focus {
			outline: none;
		}
	</style>
	<script>
		window.addEventListener('keydown', (e) => {
			const panicKey = localStorage.getItem('hwhub_panic_key') || '\\';
			const panicAction = localStorage.getItem('hwhub_panic_action') || 'decoy';
			if (e.key === panicKey) {
				e.preventDefault();
				if (panicAction === 'dnevnik') window.location.replace('https://dnevnik.ru');
				else if (panicAction === 'wiki') window.location.replace('https://ru.wikipedia.org/wiki/Информатика');
				else if (panicAction === 'ege') window.location.replace('https://inf-ege.sdamgia.ru/');
				else window.location.href = '../../index.html';
			}
		});
	</script>
</head>
<body>
</body>
<script type="text/javascript" src="js/main.js"></script>
</html>
