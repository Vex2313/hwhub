<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <radialGradient id="pacBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0e1c"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>
    <filter id="mazeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#pacBg)"/>

  <!-- Maze Lines -->
  <g stroke="#1d4ed8" stroke-width="3" fill="none" opacity="0.65" filter="url(#mazeGlow)">
    <rect x="25" y="25" width="350" height="190" rx="12"/>
    <path d="M 70 65 H 150 V 95 H 70 Z"/>
    <path d="M 250 65 H 330 V 95 H 250 Z"/>
    <path d="M 180 25 V 80"/>
    <path d="M 180 160 V 215"/>
    <path d="M 70 145 H 150"/>
    <path d="M 250 145 H 330"/>
  </g>

  <!-- Pellets -->
  <g fill="#fde047" opacity="0.85">
    <circle cx="210" cy="120" r="3"/>
    <circle cx="240" cy="120" r="3"/>
    <circle cx="270" cy="120" r="3"/>
    <circle cx="300" cy="120" r="7"/> <!-- Energizer pellet -->
  </g>

  <!-- Pacman -->
  <g transform="translate(150, 120)">
    <path d="M 0 0 L 26 -16 A 30 30 0 1 0 26 16 Z" fill="#eab308"/>
  </g>

  <!-- Red Ghost (Blinky) chasing -->
  <g transform="translate(65, 96)">
    <!-- Ghost Body -->
    <path d="M 0 25 C 0 10 10 0 24 0 C 38 0 48 10 48 25 L 48 45 L 40 39 L 32 45 L 24 39 L 16 45 L 8 39 L 0 45 Z" fill="#ef4444"/>
    <!-- Eyes -->
    <ellipse cx="14" cy="18" rx="6" ry="7" fill="#ffffff"/>
    <ellipse cx="34" cy="18" rx="6" ry="7" fill="#ffffff"/>
    <circle cx="17" cy="18" r="3.5" fill="#1e3a8a"/>
    <circle cx="37" cy="18" r="3.5" fill="#1e3a8a"/>
  </g>

  <!-- Text -->
  <text x="200" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#facc15" letter-spacing="4">PAC-MAN</text>
  <text x="200" y="219" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#93c5fd" letter-spacing="2" opacity="0.7">AUTHENTIC ARCADE</text>
</svg>
