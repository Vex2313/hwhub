<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Slope</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #gameContainer {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
  <script>
    // Panic Key Handler
    window.addEventListener('keydown', (e) => {
      const panicKey = localStorage.getItem('hwhub_panic_key') || '\\';
      const panicAction = localStorage.getItem('hwhub_panic_action') || 'decoy';

      if (e.key === panicKey) {
        e.preventDefault();
        if (panicAction === 'dnevnik') window.location.replace('https://dnevnik.ru');
        else if (panicAction === 'wiki') window.location.replace('https://ru.wikipedia.org/wiki/Информатика');
        else if (panicAction === 'ege') window.location.replace('https://inf-ege.sdamgia.ru/');
        else window.location.href = '../../index.html';
      }
    });
  </script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope_27Sept.json");
  </script>
</head>
<body>
  <div id="gameContainer"></div>
</body>
</html>
