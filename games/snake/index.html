<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }
    .game-wrap {
      background: #161922;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }
    .score-val { color: #10b981; font-family: monospace; font-size: 18px; font-weight: bold; }
    canvas {
      background: #090a0f;
      border: 1px solid #1f2430;
      border-radius: 4px;
      display: block;
      image-rendering: pixelated;
    }
    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
    }
    .key {
      background: #252b3b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .msg-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(13, 15, 20, 0.9);
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 20px 30px;
      display: none;
    }
    .msg-overlay h2 { color: #f87171; margin-bottom: 8px; font-size: 20px; }
    .msg-overlay p { color: #94a3b8; margin-bottom: 14px; font-size: 14px; }
    .restart-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .restart-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div style="position: relative;">
    <div class="game-wrap">
      <div class="header">
        <div>СЧЁТ: <span id="score" class="score-val">0</span></div>
        <div>РЕКОРД: <span id="best" class="score-val">0</span></div>
      </div>
      <canvas id="game" width="400" height="400"></canvas>
      <div class="controls-hint">
        Управление: <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> или <span class="key">Стрелки</span> • Пауза: <span class="key">Пробел</span>
      </div>
    </div>
    <div id="overlay" class="msg-overlay">
      <h2 id="ov-title">ИГРА ОКОНЧЕНА</h2>
      <p id="ov-desc">Счёт: 0</p>
      <button class="restart-btn" onclick="resetGame()">Начать заново</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const ovDesc = document.getElementById('ov-desc');

    const GRID = 20;
    const COUNT = canvas.width / GRID;

    let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
    let dir = {x: 0, y: -1};
    let nextDir = {x: 0, y: -1};
    let food = {x: 15, y: 8};
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0', 10);
    bestEl.textContent = best;
    let isGameOver = false;
    let isPaused = false;
    let gameLoop = null;

    function placeFood() {
      while (true) {
        food = {
          x: Math.floor(Math.random() * COUNT),
          y: Math.floor(Math.random() * COUNT)
        };
        if (!snake.some(seg => seg.x === food.x && seg.y === food.y)) break;
      }
    }

    function step() {
      if (isGameOver || isPaused) return;

      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

      // Wall collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        return gameOver();
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('snake_best', best);
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#090a0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid subtle lines
      ctx.strokeStyle = '#141721';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((seg, i) => {
        if (i === 0) {
          ctx.fillStyle = '#10b981';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 6;
        } else {
          ctx.fillStyle = '#059669';
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
      });
      ctx.shadowBlur = 0;
    }

    function gameOver() {
      isGameOver = true;
      clearInterval(gameLoop);
      ovDesc.textContent = 'Итоговый счёт: ' + score;
      overlay.style.display = 'block';
    }

    function resetGame() {
      snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
      dir = {x: 0, y: -1};
      nextDir = {x: 0, y: -1};
      score = 0;
      scoreEl.textContent = '0';
      isGameOver = false;
      isPaused = false;
      overlay.style.display = 'none';
      placeFood();
      draw();
      clearInterval(gameLoop);
      gameLoop = setInterval(step, 90);
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if ((key === 'arrowup' || key === 'w') && dir.y === 0) {
        nextDir = {x: 0, y: -1};
        e.preventDefault();
      } else if ((key === 'arrowdown' || key === 's') && dir.y === 0) {
        nextDir = {x: 0, y: 1};
        e.preventDefault();
      } else if ((key === 'arrowleft' || key === 'a') && dir.x === 0) {
        nextDir = {x: -1, y: 0};
        e.preventDefault();
      } else if ((key === 'arrowright' || key === 'd') && dir.x === 0) {
        nextDir = {x: 1, y: 0};
        e.preventDefault();
      } else if (key === ' ') {
        isPaused = !isPaused;
        e.preventDefault();
      }
    });

    resetGame();
  </script>
</body>
</html>
