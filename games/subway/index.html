
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Subway Surfers</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #game, #canvas, canvas { width: 100% !important; height: 100% !important; display: block; }
    </style>

    <script type="text/javascript" src="4399.z.js"></script>
    <script>
        // Panic key support
        window.addEventListener('keydown', (e) => {
            const panicKey = localStorage.getItem('hwhub_panic_key') || '\\';
            const panicAction = localStorage.getItem('hwhub_panic_action') || 'decoy';
            if (e.key === panicKey) {
                e.preventDefault();
                if (panicAction === 'dnevnik') window.location.replace('https://dnevnik.ru');
                else if (panicAction === 'wiki') window.location.replace('https://ru.wikipedia.org/wiki/Информатика');
                else if (panicAction === 'ege') window.location.replace('https://inf-ege.sdamgia.ru/');
                else window.location.href = '../../index.html';
            }
        });

        window.config = {
            loader: 'unity',
            debug: false,
            maxRatio: 16 / 9,
            minRatio: 9 / 16,

            title: 'Subway Surfers: San Francisco',

            unityVersion: '2019.4.18f1',
            unityWebglBuildUrl: 'Build\/SanFrancisco\/SanFrancisco.json',

            fileSize: 35,
            cachedDecompressedFileSizes: {
                'SanFrancisco.asm.code.unityweb': 9077143,
                'SanFrancisco.asm.framework.unityweb': 86369,
                'SanFrancisco.asm.memory.unityweb': 951447,
                'SanFrancisco.data.unityweb': 18323917,
                'SanFrancisco.wasm.code.unityweb': 7279617,
                'SanFrancisco.wasm.framework.unityweb': 90693,
            },
        };
    </script>
</head>
