<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Культовый скролл-шутер Touhou 7: Perfect Cherry Blossom (東方妖々夢) в браузере (TypeScript-реимплементация с оригинальными данными ECL/ANM/BGM). Уровни 1–8, Extra, Phantasm, Рейму, Мариса, Сакуя." />
  <title>Touhou 7: Perfect Cherry Blossom — HW Hub</title>
  <link rel="icon" type="image/png" href="thumb.png">
  <link rel="stylesheet" href="src/th07.css" />
  <script>
    // Tab Cloaking Sync
    (function() {
      const PRESETS = {
        classroom: { title: "Google Класс", icon: "https://ssl.gstatic.com/classroom/favicon.png" },
        dnevnik: { title: "Электронный дневник", icon: "https://dnevnik.ru/favicon.ico" },
        resh: { title: "РЭШ — Российская электронная школа", icon: "https://resh.edu.ru/favicon.ico" },
        wiki: { title: "Википедия — свободная энциклопедия", icon: "https://ru.wikipedia.org/static/favicon/wikipedia.ico" }
      };
      const savedPreset = localStorage.getItem('hwhub_tab_preset');
      if (savedPreset && PRESETS[savedPreset]) {
        document.title = PRESETS[savedPreset].title;
        let link = document.querySelector("link[rel*='icon']");
        if (!link) {
          link = document.createElement("link");
          link.rel = "icon";
          document.head.appendChild(link);
        }
        link.href = PRESETS[savedPreset].icon;
      }
    })();

    // Panic Key Handler
    window.addEventListener('keydown', (e) => {
      const panicKey = localStorage.getItem('hwhub_panic_key') || '\\';
      const panicAction = localStorage.getItem('hwhub_panic_action') || 'decoy';

      if (e.key === panicKey) {
        e.preventDefault();
        triggerPanic();
      }
    });

    function triggerPanic() {
      const panicAction = localStorage.getItem('hwhub_panic_action') || 'decoy';
      if (panicAction === 'dnevnik') window.location.replace('https://dnevnik.ru');
      else if (panicAction === 'wiki') window.location.replace('https://ru.wikipedia.org/wiki/Информатика');
      else if (panicAction === 'ege') window.location.replace('https://inf-ege.sdamgia.ru/');
      else window.location.href = '../../index.html';
    }

    function openAboutBlank() {
      const win = window.open('about:blank', '_blank');
      if (!win) {
        alert('Всплывающее окно заблокировано браузером. Разрешите всплывающие окна.');
        return;
      }
      const iframe = win.document.createElement('iframe');
      iframe.style.position = 'fixed';
      iframe.style.top = '0';
      iframe.style.left = '0';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.style.outline = 'none';
      iframe.src = window.location.href;
      win.document.body.style.margin = '0';
      win.document.body.style.height = '100vh';
      win.document.body.style.overflow = 'hidden';
      win.document.body.appendChild(iframe);
      win.document.title = document.title;
    }

    function toggleFullscreen() {
      const el = document.getElementById("app");
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #050509;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 44px;
      background: #11141e;
      border-bottom: 1px solid #1f2536;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 50;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: #1b202e;
      color: #cbd5e1;
      border: 1px solid #2d374d;
      padding: 4px 10px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .back-btn:hover { background: #262e45; color: #fff; }

    .game-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      background: #db2777;
      color: #fdf2f8;
    }

    .controls-hint {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      gap: 10px;
    }
    .controls-hint kbd {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f472b6;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 10px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-btn {
      background: #1a202c;
      border: 1px solid #2d3748;
      color: #cbd5e0;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .tool-btn:hover { background: #2d3748; color: #fff; }

    .panic-btn {
      background: #7f1d1d;
      border-color: #991b1b;
      color: #fecaca;
    }
    .panic-btn:hover { background: #991b1b; color: #fff; }

    #app {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(100% - 44px);
      background: #050509;
    }

    #game {
      width: min(100vw, calc((100vh - 44px) * 4 / 3));
      height: min(calc(100vh - 44px), calc(100vw * 3 / 4));
      image-rendering: pixelated;
      outline: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      border: 1px solid #1f2536;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a href="../../index.html" class="back-btn">← Меню</a>
      <span style="font-size: 13px; font-weight: 600; color: #f472b6;">Touhou 7: PCB</span>
      <span class="game-badge">STAGE 1-8 + EXTRA</span>
      <div class="controls-hint">
        <span><kbd>Стрелки</kbd> Движение</span>
        <span><kbd>Z</kbd> / <kbd>Enter</kbd> Огонь / Выбор</span>
        <span><kbd>X</kbd> Бомба / Отмена</span>
        <span><kbd>Shift</kbd> Фокус (хитбокс)</span>
        <span><kbd>Esc</kbd> Пауза</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="tool-btn" onclick="openAboutBlank()" title="Открыть в чистой вкладке about:blank">🕶️ Скрытый режим</button>
      <button class="tool-btn" onclick="toggleFullscreen()" title="Полный экран">⛶ Экран</button>
      <button class="tool-btn panic-btn" onclick="triggerPanic()" title="Паника (\)">🚨 Паника (\)</button>
    </div>
  </div>

  <div id="app"><canvas id="game" width="640" height="480" tabindex="0"></canvas></div>
  <script defer src="dist/th07.js"></script>
</body>
</html>
