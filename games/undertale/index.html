<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>UNDERTALE — HW Hub</title>
    <meta name="description" content="Культовая ролевая игра Undertale в браузере (GameMaker HTML5/WASM WebAssembly Runner). Полная версия со всеми музыкальными треками и локациями." />
    <link rel="icon" type="image/png" href="thumb.png">

    <script>
      // Tab Cloaking Sync
      (function() {
        const PRESETS = {
          classroom: { title: "Google Класс", icon: "https://ssl.gstatic.com/classroom/favicon.png" },
          dnevnik: { title: "Электронный дневник", icon: "https://dnevnik.ru/favicon.ico" },
          resh: { title: "РЭШ — Российская электронная школа", icon: "https://resh.edu.ru/favicon.ico" },
          wiki: { title: "Википедия — свободная энциклопедия", icon: "https://ru.wikipedia.org/static/favicon/wikipedia.ico" }
        };
        const savedPreset = localStorage.getItem('hwhub_tab_preset');
        if (savedPreset && PRESETS[savedPreset]) {
          document.title = PRESETS[savedPreset].title;
          let link = document.querySelector("link[rel*='icon']");
          if (!link) {
            link = document.createElement("link");
            link.rel = "icon";
            document.head.appendChild(link);
          }
          link.href = PRESETS[savedPreset].icon;
        }
      })();

      // Panic Key Handler
      window.addEventListener('keydown', (e) => {
        const panicKey = localStorage.getItem('hwhub_panic_key') || '\\';
        if (e.key === panicKey) {
          e.preventDefault();
          triggerPanic();
        }
      });

      function triggerPanic() {
        const panicAction = localStorage.getItem('hwhub_panic_action') || 'decoy';
        if (panicAction === 'dnevnik') window.location.replace('https://dnevnik.ru');
        else if (panicAction === 'wiki') window.location.replace('https://ru.wikipedia.org/wiki/Информатика');
        else if (panicAction === 'ege') window.location.replace('https://inf-ege.sdamgia.ru/');
        else window.location.href = '../../index.html';
      }

      function openAboutBlank() {
        const win = window.open('about:blank', '_blank');
        if (!win) {
          alert('Всплывающее окно заблокировано браузером. Разрешите всплывающие окна.');
          return;
        }
        const iframe = win.document.createElement('iframe');
        iframe.style.position = 'fixed';
        iframe.style.top = '0';
        iframe.style.left = '0';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.style.outline = 'none';
        iframe.src = window.location.href;
        win.document.body.style.margin = '0';
        win.document.body.style.height = '100vh';
        win.document.body.style.overflow = 'hidden';
        win.document.body.appendChild(iframe);
        win.document.title = document.title;
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
    </script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Lucida Console", Monaco, monospace;
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        background-color: #000000;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        user-select: none;
      }

      /* Top bar */
      .topbar {
        height: 44px;
        background: #0d0f18;
        border-bottom: 1px solid #1f2536;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        z-index: 50;
        flex-shrink: 0;
      }
      .tb-left, .tb-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tb-center {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #94a3b8;
      }
      .tb-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .game-name {
        font-weight: 700;
        font-size: 14px;
        color: #f8fafc;
        letter-spacing: 0.5px;
      }
      .tb-badge {
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 4px;
        font-weight: 600;
        background: rgba(239, 68, 68, 0.2);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.4);
      }
      .tb-ctrls kbd {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 3px;
        padding: 1px 5px;
        font-family: inherit;
        font-size: 10px;
        color: #e2e8f0;
      }
      .tb-btn {
        background: #1e2433;
        border: 1px solid #2d3748;
        color: #e2e8f0;
        padding: 5px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        text-decoration: none;
        transition: all 0.15s;
      }
      .tb-btn:hover {
        background: #2b3548;
        color: #fff;
      }
      .tb-btn svg {
        width: 13px;
        height: 13px;
        fill: currentColor;
      }

      /* Game wrapper */
      #game-wrapper {
        flex: 1;
        width: 100%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        overflow: hidden;
      }

      canvas.emscripten {
        display: none;
        background-color: black;
        transition: opacity 1.5s ease-in;
        opacity: 0;
        filter: blur(0) grayscale(0);
        image-rendering: optimizeSpeed;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: pixelated;
        -ms-interpolation-mode: nearest-neighbor;
        outline: none;
      }

      canvas.active {
        display: block;
        opacity: 1;
      }

      canvas.paused {
        filter: blur(2px) grayscale(1);
      }

      canvas.unpaused {
        filter: none;
      }

      canvas.animatedSizeTransitions {
        transition: width 0.3s ease, height 0.3s ease;
      }

      /* Spinner and loading */
      .loading {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        pointer-events: none;
        z-index: 10;
      }

      .spinner {
        height: 38px;
        width: 38px;
        animation: rotation 0.8s linear infinite;
        border: 4px solid #334155;
        border-top: 4px solid #ef4444;
        border-radius: 100%;
        margin-bottom: 14px;
      }

      @keyframes rotation {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      #status {
        display: inline-block;
        font-weight: 600;
        font-size: 14px;
        color: #f1f5f9;
        font-family: inherit;
        text-align: center;
        margin-bottom: 8px;
      }

      #progress {
        width: 280px;
        height: 8px;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid #334155;
      }

      progress[value]::-webkit-progress-bar {
        background-color: #1e293b;
      }
      progress[value]::-webkit-progress-value {
        background: linear-gradient(90deg, #ef4444, #f59e0b);
      }
      progress[value]::-moz-progress-bar {
        background: linear-gradient(90deg, #ef4444, #f59e0b);
      }

      /* Pause menu */
      #pauseMenuContainer {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.85);
        z-index: 30;
      }

      #pauseMenuContainer[hidden] {
        display: none !important;
      }

      #pauseMenuBorder {
        border: 2px solid #ef4444;
        padding: 2px;
        border-radius: 8px;
        background: #11141e;
        width: 80vw;
        max-width: 340px;
        box-shadow: 0 10px 30px rgba(239, 68, 68, 0.25);
      }

      #pauseMenu {
        display: flex;
        flex-direction: column;
        padding: 30px 24px;
        background: #0d0f17;
        border-radius: 6px;
        gap: 12px;
      }

      #pauseMenu .pm-title {
        text-align: center;
        font-size: 16px;
        font-weight: bold;
        color: #f8fafc;
        margin-bottom: 8px;
        letter-spacing: 1px;
      }

      #pauseMenu button {
        font-family: inherit;
        font-weight: 600;
        font-size: 14px;
        color: white;
        background: #ef4444;
        border: none;
        border-radius: 6px;
        padding: 12px 20px;
        cursor: pointer;
        transition: filter 0.15s, transform 0.1s;
      }

      #pauseMenu button:hover {
        filter: brightness(1.15);
      }
      #pauseMenu button:active {
        transform: scale(0.98);
      }
      #pauseMenu button[hidden] {
        display: none;
      }

      /* Hidden output for engine */
      #output-container, #output, #message-container {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- HW Hub Topbar -->
    <header class="topbar">
      <div class="tb-left">
        <a href="../../index.html" class="tb-btn" title="Вернуться в каталог (Esc)">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          <span>В хаб</span>
        </a>
        <div class="tb-title">
          <span class="game-name">UNDERTALE</span>
          <span class="tb-badge">WASM PORT</span>
        </div>
      </div>

      <div class="tb-center">
        <span class="tb-ctrls">
          <kbd>Стрелки</kbd> Ходьба &bull;
          <kbd>Z</kbd> / <kbd>Enter</kbd> Действие &bull;
          <kbd>X</kbd> / <kbd>Shift</kbd> Отмена / Пропуск диалога &bull;
          <kbd>C</kbd> / <kbd>Ctrl</kbd> Меню &bull;
          <kbd>F4</kbd> Экран
        </span>
      </div>

      <div class="tb-right">
        <button class="tb-btn" onclick="openAboutBlank()" title="Открыть в чистой вкладке about:blank для скрытности в школе">
          <span>about:blank</span>
        </button>
        <button class="tb-btn" onclick="toggleFullscreen()" title="Полноэкранный режим">
          <span>На весь экран</span>
        </button>
      </div>
    </header>

    <!-- Main Game Area -->
    <div id="game-wrapper">
      <canvas
        class="emscripten"
        id="canvas"
        oncontextmenu="event.preventDefault()"
        tabindex="-1"
      ></canvas>

      <div id="pauseMenuContainer" hidden>
        <div id="pauseMenuBorder">
          <div id="pauseMenu">
            <div class="pm-title">ПАУЗА</div>
            <button id="resumeButton" onclick="resume()">Продолжить</button>
            <button id="quitButton" onclick="quitIfSupported()" hidden>Выход</button>
          </div>
        </div>
      </div>

      <div class="loading" id="loadingOverlay">
        <div class="spinner" id="spinner"></div>
        <div class="emscripten" id="status">Инициализация Undertale...</div>
        <progress value="0" max="100" id="progress"></progress>
      </div>
    </div>

    <!-- Engine elements -->
    <div id="message-container"><div id="messages"></div></div>
    <div id="output-container"><textarea id="output" rows="8"></textarea></div>

    <script>
      // Safe tick worker placeholder
      try {
        const tickEl = document.querySelector('#tick-worker');
        if (tickEl) {
          const blob = new Blob([tickEl.textContent]);
          const worker = new Worker(window.URL.createObjectURL(blob));
          worker.onmessage = function () {
            if (typeof GM_tick === 'function') GM_tick(performance.now());
          };
          document.addEventListener('visibilitychange', function () {
            if (typeof isMultiplayer === 'function' && isMultiplayer()) {
              if (document.visibilityState === 'hidden') {
                worker.postMessage({run: true, fps: 60});
              } else {
                worker.postMessage({run: false});
              }
            }
          });
        }
      } catch (e) {
        console.warn("Tick worker bypassed:", e);
      }

      // Fetch helper with Cache API support for fast instant restarts
      async function fetchPartWithCache(url, onProgress) {
        if ('caches' in window) {
          try {
            const cache = await caches.open('undertale-cache-v1');
            const cached = await cache.match(url);
            if (cached) {
              return await cached.arrayBuffer();
            }
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status + " fetching " + url);
            await cache.put(url, response.clone());
            return await response.arrayBuffer();
          } catch (e) {
            console.warn("Cache API fallback for", url, e);
          }
        }
        const response = await fetch(url);
        if (!response.ok) throw new Error("HTTP " + response.status + " fetching " + url);
        return await response.arrayBuffer();
      }

      // Merge split game.unx parts
      function mergeFiles(fileParts) {
        return new Promise((resolve, reject) => {
          let buffers = [];
          const status = document.getElementById("status");
          const progress = document.getElementById("progress");
          if (progress) {
            progress.hidden = false;
            progress.max = fileParts.length;
            progress.value = 0;
          }

          async function fetchPart(index) {
            if (index >= fileParts.length) {
              if (status) status.textContent = "Объединение игровых пакетов...";
              let mergedBlob = new Blob(buffers, { type: 'application/octet-stream' });
              let mergedFileUrl = URL.createObjectURL(mergedBlob);
              resolve(mergedFileUrl);
              return;
            }
            if (status) status.textContent = `Загрузка Undertale (${index + 1}/${fileParts.length})...`;
            if (progress) progress.value = index;

            try {
              const buf = await fetchPartWithCache(fileParts[index]);
              buffers.push(buf);
              if (progress) progress.value = index + 1;
              fetchPart(index + 1);
            } catch (err) {
              reject(err);
            }
          }
          fetchPart(0);
        });
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }

      // Initialize loader
      mergeFiles(getParts("game.unx", 1, 5)).then(async url => {
        window.gameUnxUrl = url;

        const originalFetch = window.fetch;
        window.fetch = async function (...args) {
          let [fetchUrl, options] = args;
          if (typeof fetchUrl === 'string' && fetchUrl.includes("game.unx")) {
            fetchUrl = window.gameUnxUrl;
          } else if (fetchUrl instanceof Request && fetchUrl.url.includes("game.unx")) {
            fetchUrl = new Request(window.gameUnxUrl, fetchUrl);
          }
          return originalFetch.call(this, fetchUrl, options);
        };

        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, reqUrl, ...rest) {
          if (typeof reqUrl === 'string' && reqUrl.includes("game.unx")) {
            reqUrl = window.gameUnxUrl;
          }
          return originalOpen.call(this, method, reqUrl, ...rest);
        };

        const status = document.getElementById("status");
        if (status) status.textContent = "Запуск движка GameMaker...";

        let indexScript = document.createElement("script");
        indexScript.src = "index.js";
        indexScript.onload = function() {
          let runnerScript = document.createElement("script");
          runnerScript.src = "runner.js";
          document.body.appendChild(runnerScript);
        };
        indexScript.onerror = function(e) {
          console.error("Failed to load index.js", e);
          if (status) status.textContent = "Ошибка загрузки index.js";
        };
        document.body.appendChild(indexScript);
      }).catch(error => {
        console.error("Failed to load Undertale game data:", error);
        const status = document.getElementById("status");
        if (status) status.textContent = "Ошибка загрузки данных Undertale: " + error.message;
      });
    </script>
  </body>
</html>
