<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui, shrink-to-fit=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">


    <title>Vex 3</title>

    <link rel="stylesheet" href="assets/css/app.css" type="text/css" />
    <script>
        window.addEventListener('keydown', (e) => {
            const panicKey = localStorage.getItem('hwhub_panic_key') || '\\';
            const panicAction = localStorage.getItem('hwhub_panic_action') || 'decoy';
            if (e.key === panicKey) {
                e.preventDefault();
                if (panicAction === 'dnevnik') window.location.replace('https://dnevnik.ru');
                else if (panicAction === 'wiki') window.location.replace('https://ru.wikipedia.org/wiki/Информатика');
                else if (panicAction === 'ege') window.location.replace('https://inf-ege.sdamgia.ru/');
                else window.location.href = '../../index.html';
            }
        });
    </script>

</head>

<body>

    <div id="content"></div>
    <div id="orientation"></div>
    <div id="loader">Loading...</div>

    <script type="text/javascript">
        var gtag;



        var gameName = "vex-3.js";






        //This all here is for cache busting;
        function addScript(src, buster, callback) {
            var s = document.createElement('script');
            s.setAttribute('src', src + '?v=' + buster);
            if (typeof callback === 'function') {
                s.onload = callback;
            }
            document.body.appendChild(s);
        }


        addScript('version.js', Date.now(), function() {

            addScript(gameName, version, function() {
                var game = new Vex3.Game();
            });

        });
    </script>
</body>

</html>
